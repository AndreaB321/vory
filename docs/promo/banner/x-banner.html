<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vory X banner</title>
<style>
  @font-face { font-family: "SF Rounded"; src: url(../video/scene/fonts/SFNSRounded.ttf); font-weight: 100 900; }
  html, body { margin: 0; background: #333; }
  .banner { position: relative; width: 1500px; height: 500px; overflow: hidden; background: #F2F2F7; font-family: -apple-system, system-ui, sans-serif; color: #0A0A0C; }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(34% 80% at 24% 62%, rgba(62,196,238,0.38), transparent 72%),
    radial-gradient(30% 70% at 42% 78%, rgba(59,123,255,0.26), transparent 72%),
    radial-gradient(26% 60% at 6% 30%, rgba(11,40,104,0.16), transparent 72%),
    radial-gradient(40% 90% at 82% 30%, rgba(59,123,255,0.10), transparent 70%); }
  .copy { position: absolute; left: 660px; top: 156px; width: 440px; }
  .eyebrow { font-size: 19px; font-weight: 650; color: #0A84FF; letter-spacing: 0.02em; margin: 0 0 10px; }
  h1 { font-family: "SF Rounded", system-ui, sans-serif; font-size: 54px; line-height: 1.02; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
  .tagwrap { display: inline-block; }
  .tag { margin: 18px 0 0; font-size: 22px; color: #3A3A3C; font-weight: 500; }
  .tag b { color: #0A0A0C; font-weight: 650; }
  .url { margin: 6px 0 0; font-size: 22px; font-weight: 600; color: #6E6E73; display: flex; justify-content: flex-start; align-items: flex-end; gap: 30px; }
  .url-text { padding-bottom: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 18px !important; border-radius: 999px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 6px 18px rgba(20,30,60,0.10); font-size: 20px; font-weight: 650; }
  .pill i { width: 10px; height: 10px; border-radius: 50%; background: #30D158; display: inline-block; }
  .stage { position: absolute; left: 130px; top: 96px; width: 400px; height: 460px; display: grid; justify-items: center; align-content: start; }
  .stage canvas, .cast canvas { position: relative; z-index: 1; }
  .shelf { position: relative; align-self: start; display: inline-flex; padding: 5px 28px; line-height: 1.05; border-radius: 999px; background: rgba(255,255,255,0.72); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 10px 30px rgba(20,30,60,0.10); font-size: 26px; font-weight: 700; }
  .cast { position: absolute; display: grid; justify-items: center; }
  .cast--inline { position: relative; display: inline-grid; justify-items: center; vertical-align: bottom; }
  .cast .shelf { padding: 3px 14px; font-size: 15px; }
</style></head>
<body>
<div class="banner" id="banner">
  <div class="glow"></div>
  <div class="copy">
    <p class="eyebrow">The iPhone remote for your Hermes agents</p>
    <h1>Your agents,<br>in your pocket.</h1>
    <div class="tagwrap"><p class="tag"><span class="pill"><i></i>Now in beta testing &nbsp;·&nbsp; TestFlight</span></p><p class="url"><span class="cast cast--inline" style="transform: translateY(10px);"><canvas id="c2"></canvas><span class="shelf">Nova</span></span><span class="url-text">vory.dev</span><span class="cast cast--inline"><canvas id="c4"></canvas><span class="shelf">Remy</span></span></p></div>
  </div>
  <div class="stage"><canvas id="vory"></canvas><div class="shelf">Vory</div></div>
  <div class="cast" style="left: 500px; top: 318px;"><canvas id="c1"></canvas><div class="shelf">Pip</div></div>
  <div class="cast" style="left: 40px; top: 128px;"><canvas id="c5"></canvas><div class="shelf">Ivy</div></div>
  <div class="cast" style="left: 60px; top: 262px;"><canvas id="c6"></canvas><div class="shelf">Bo</div></div>
  <div class="cast" style="left: 486px; top: 128px;"><canvas id="c3"></canvas><div class="shelf">Otto</div></div>
</div>
<script type="module">
  import { paintStill, VORY, stillMotion, bodyPieces } from "../site/public/assets/vory-bot.js";
  // The app's seating: the bot's drawn base tucks just into the top of its pill (about a quarter of
  // the pill's height, which is what 9 pt on the app's 34 pt header pill comes to).
  const seat = (canvas, shape, size) => {
    let bottom = 0; for (const piece of bodyPieces(shape, { x: 0, y: 0, w: size, h: size }, 0, false)) for (const q of piece) if (q.y > bottom) bottom = q.y;
    const shelf = canvas.nextElementSibling; const h = shelf.getBoundingClientRect().height;
    // Tuck a hair less than the app's quarter so the name never touches the bot.
    shelf.style.marginTop = `${-((size - bottom) + h * 0.12)}px`;
  };
  await document.fonts.load('800 40px "SF Rounded"').catch(() => {});
  const m = stillMotion();
  const bots = [["vory", VORY, 360], ["c1", { shape: "circle", eyes: "classic", hex: "#FF453A", finish: "glass" }, 96], ["c2", { shape: "drop", eyes: "wide", hex: "#F4F4F5", finish: "glass" }, 64], ["c4", { shape: "hexagon", eyes: "round", hex: "#BF5AF2", finish: "glass" }, 64], ["c5", { shape: "square", eyes: "round", hex: "#30D158", finish: "glass" }, 72], ["c6", { shape: "pill", eyes: "wide", hex: "#FFD60A", finish: "flat" }, 76], ["c3", { shape: "triangle", eyes: "bold", hex: "#F5A524", finish: "flat" }, 88]];
  for (const [id, spec, size] of bots) { const c = document.getElementById(id); paintStill(c, spec, size, m, true); seat(c, spec.shape, size); }
  window.ready = true;
</script>
</body></html>
